<!-- 4. SONUÇ VE DETAYLI ANALİZ EKRANI -->
    <section id="resultScreen" class="card hidden">
      <h2>🎉 YDS Sınav Sonuç Analizi</h2>
      
      <div class="yds-score-card">
        <p>Tahmini YDS Puanınız</p>
        <h1 id="ydsScoreText">0.0</h1>
        <span id="ydsLevelTag" class="level-tag">Seviye: -</span>
      </div>

      <div class="score-summary">
        <div class="score-card">
          <span id="scoreText">0 / 0</span>
          <p>Doğru / Toplam</p>
        </div>
        <div class="score-card">
          <span id="emptyText">0</span>
          <p>Boş Soru</p>
        </div>
        <div class="score-card">
          <span id="totalTimeText">00:00</span>
          <p>Toplam Süre</p>
        </div>
      </div>

      <!-- YENİ GÖRSEL ANALİZ KARTLARI VE GRAFİK ALANI -->
      <div class="analysis-box">
        <h3>📊 Soru Tipi Bazlı Başarı ve Süre Grafiği</h3>
        <div id="typeAnalysisChart" class="type-chart-container"></div>
      </div>

      <div class="analysis-box advice-box">
        <h3>💡 Yapay Zeka YDS Strateji Tavsiyesi</h3>
        <p id="analysisAdviceText">Analiz çıkarılıyor...</p>
      </div>

      <button onclick="resetApp()" class="btn-primary" style="margin-top: 1.5rem;">Yeni Deneme Yükle</button>
    </section>
